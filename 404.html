<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Shreya S Rao</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-latin-wght.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/hanken-latin-wght.woff2) format("woff2")}
:root{--bg:#f3f5f4;--text:#111816;--muted:#55625e;--line:#d9e0dd;--accent:#0b6e6e;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c1110;--text:#e6edeb;--muted:#94a39f;--line:#24302e;--accent:#5fd0c8;--accent-ink:#06201e;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:grid;place-items:center;padding:20px}
main{max-width:480px;text-align:center}
p.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.08em;color:var(--accent);margin-bottom:12px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:36px;line-height:1.1;letter-spacing:-.03em;margin-bottom:12px}
p{color:var(--muted);margin-bottom:24px}
a{display:inline-block;padding:10px 18px;border-radius:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none}
a:hover{opacity:.9}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old or mistyped.</p>
  <a href="/">Back to the portfolio</a>
</main>
</body>
</html>
